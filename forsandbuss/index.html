<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Forsand Buss</title>
    <style>
        :root {
            --bg: #edf3f0;
            --paper: rgba(255,255,255,0.82);
            --panel: #ffffff;
            --ink: #1a2a2a;
            --muted: #5a6f6d;
            --line: #dfe9e5;
            --brand: #0d6763;
            --brand-2: #1b7d78;
            --brand-soft: #ddf1ee;
            --accent: #f1b75d;
            --success: #2b9a74;
            --danger: #d15754;
            --shadow: 0 18px 42px rgba(12, 46, 47, 0.14);
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            min-height: 100%;
            font-family: "Segoe UI", Inter, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            background: radial-gradient(circle at top left, rgba(255,255,255,0.8), transparent 26%), linear-gradient(155deg, #edf3f0 0%, #e8f0ee 43%, #f4efe3 100%);
            color: var(--ink);
        }

        body {
            padding: 20px 12px 24px;
            overflow-x: hidden;
        }

        .app-shell {
            max-width: 980px;
            margin: 0 auto;
            background: rgba(255,255,255,0.38);
            border: 1px solid rgba(24, 77, 75, 0.12);
            border-radius: 24px;
            box-shadow: var(--shadow);
            overflow: hidden;
            backdrop-filter: blur(10px);
            min-height: calc(100vh - 40px);
        }

        .topbar {
            background: linear-gradient(135deg, var(--brand) 0%, var(--brand-2) 40%, #5a7a74 100%);
            color: white;
            padding: 20px 18px 16px;
            position: relative;
            overflow: hidden;
        }

        .topbar::after {
            content: "";
            position: absolute;
            right: -80px;
            bottom: -100px;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            background: rgba(255,255,255,0.08);
            box-shadow: 0 0 0 30px rgba(255,255,255,0.02), 0 0 0 60px rgba(255,255,255,0.02);
        }

        .topbar-inner {
            position: relative;
            z-index: 1;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 14px;
        }

        .eyebrow {
            margin: 0 0 10px;
            font-size: 0.68rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            font-weight: 800;
            color: rgba(234, 247, 244, 0.82);
        }

        h1 {
            margin: 0;
            font-size: clamp(2.1rem, 4.2vw, 3.3rem);
            line-height: 0.96;
            letter-spacing: -0.06em;
        }

        .live-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 999px;
            padding: 8px 14px;
            font-size: 0.72rem;
            font-weight: 800;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .live-pill::before {
            content: "";
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #8fe2af;
            box-shadow: 0 0 12px rgba(143, 226, 175, 0.9);
        }

        .hero {
            margin: -8px 14px 0;
            padding: 14px 16px 12px;
            background: linear-gradient(180deg, rgba(255,255,255,0.96), rgba(245,250,248,0.96));
            border: 1px solid rgba(11, 92, 88, 0.12);
            border-radius: 18px;
            position: relative;
            z-index: 2;
            box-shadow: 0 10px 24px rgba(6, 52, 49, 0.1);
        }

        .hero-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 12px;
        }

        .label {
            font-size: 0.7rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--muted);
            font-weight: 800;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 6px 10px;
            border-radius: 999px;
            background: var(--brand-soft);
            color: var(--brand);
            font-size: 0.72rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .next-row {
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .next-time {
            font-size: clamp(2.7rem, 8vw, 4.2rem);
            line-height: 1;
            font-weight: 900;
            letter-spacing: -0.06em;
            margin: 0;
        }

        .next-meta {
            margin: 0;
            color: var(--muted);
            font-size: 0.88rem;
            line-height: 1.45;
            text-align: right;
            font-weight: 600;
        }

        .controls {
            padding: 12px 14px 0;
        }

        .stop-picker {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .stop-btn, .mode-btn {
            appearance: none;
            border: 1px solid rgba(13, 103, 99, 0.16);
            background: rgba(13, 103, 99, 0.04);
            color: var(--muted);
            border-radius: 12px;
            padding: 10px 12px;
            font: inherit;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.18s ease;
        }

        .stop-btn {
            flex: 1 1 120px;
            min-width: 0;
            font-size: 0.96rem;
        }

        .stop-btn.active, .mode-btn.active {
            background: linear-gradient(135deg, var(--brand), var(--brand-2));
            border-color: transparent;
            color: white;
            box-shadow: 0 10px 18px rgba(13, 103, 99, 0.18);
        }

        .last-updated {
            color: var(--muted);
            font-size: 0.76rem;
            font-weight: 800;
            letter-spacing: 0.03em;
        }

        .status-panel {
            padding: 0 12px 12px;
        }

        .loading, .error, .empty-state {
            background: rgba(255,255,255,0.7);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 24px 14px;
            color: var(--muted);
            font-weight: 700;
            text-align: center;
            margin: 12px 0;
        }

        .error {
            color: var(--danger);
            border-color: rgba(209, 87, 84, 0.2);
            background: rgba(209, 87, 84, 0.04);
        }

        .departures {
            padding: 0 12px 12px;
        }

        .show-more {
            width: 100%;
            border: 1px solid rgba(13, 103, 99, 0.15);
            background: rgba(13, 103, 99, 0.05);
            color: var(--brand);
            font: inherit;
            font-weight: 800;
            border-radius: 12px;
            padding: 12px 14px;
            margin-top: 8px;
            cursor: pointer;
        }

        .departure-card {
            display: grid;
            grid-template-columns: auto minmax(0,1fr) auto;
            gap: 8px 10px;
            align-items: center;
            background: rgba(255,255,255,0.76);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 12px 10px;
            margin-top: 8px;
            box-shadow: 0 6px 16px rgba(8, 48, 46, 0.05);
        }

        .line-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--brand), var(--brand-2));
            color: white;
            font-size: 1.05rem;
            font-weight: 900;
            line-height: 1;
            box-shadow: 0 10px 20px rgba(14, 103, 99, 0.18);
        }

        .departure-main {
            min-width: 0;
        }

        .route-name {
            margin: 0;
            font-size: 1rem;
            font-weight: 800;
            line-height: 1.3;
        }

        .route-stop {
            margin-top: 4px;
            color: var(--muted);
            font-size: 0.76rem;
            font-weight: 700;
        }

        .time-side {
            text-align: right;
            white-space: nowrap;
        }

        .departure-time {
            font-size: 1.1rem;
            font-weight: 900;
            letter-spacing: -0.04em;
            line-height: 1.1;
        }

        .time-sub {
            margin-top: 4px;
            font-size: 0.68rem;
            font-weight: 800;
            color: var(--muted);
        }

        .realtime { color: var(--success); }
        .delayed { color: var(--danger); }

        @media (max-width: 640px) {
            body { padding: 10px 8px 16px; }
            .app-shell { min-height: auto; }
            .topbar { padding: 16px 14px 12px; }
            .topbar-inner { align-items: flex-start; flex-direction: column; }
            .hero { margin: -2px 10px 0; padding: 12px 14px 10px; }
            .hero-top, .next-row { align-items: flex-start; flex-direction: column; }
            .next-meta { text-align: left; }
            .controls { padding: 10px 10px 0; }
            .stop-picker { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .stop-btn { width: 100%; font-size: 0.84rem; }
            .last-updated { width: 100%; text-align: right; }
            .status-panel, .departures { padding-left: 8px; padding-right: 8px; }
            .departure-card { grid-template-columns: auto 1fr; gap: 8px 10px; }
            .time-side { grid-column: 2; text-align: left; }
        }
    </style>
</head>
<body>
    <div class="app-shell">
        <header class="topbar">
            <div class="topbar-inner">
                <div>
                    <p class="eyebrow">Rutenett · Forsand</p>
                    <h1 id="headerTitle">Buss i Forsand</h1>
                </div>
                <span class="live-pill" id="headerStatus">Live</span>
            </div>
        </header>

        <section class="hero" aria-live="polite">
            <div class="hero-top">
                <span class="label">Neste buss</span>
                <span class="badge" id="serviceState">Sjekker</span>
            </div>
            <div class="next-row">
                <p class="next-time" id="nextBusTime">--:--</p>
                <p class="next-meta" id="nextBusMeta">Laster avganger...</p>
            </div>
        </section>

        <div class="controls">
            <div class="stop-picker" aria-label="Velg holdeplass">
                <button class="stop-btn active" type="button" data-stop="forsand">Forsand – Bergekleiva B</button>
                <button class="stop-btn" type="button" data-stop="jorpeland">Jørpeland – Strand rådhus</button>
            </div>
            <div class="last-updated" id="lastUpdated">Laster data...</div>
        </div>

        <div id="statusPanel" class="status-panel"></div>
    </div>

    <script>
        const QUAY_FORSAND = 'NSR:Quay:48722';
        const QUAY_JORPELAND = 'NSR:Quay:48261';
        const ENTUR_API = 'https://api.entur.io/journey-planner/v3/graphql';

        const STOP_CONFIG = {
            forsand: { label: 'Forsand – Bergekleiva B', quayId: QUAY_FORSAND, opposite: 'jorpeland' },
            jorpeland: { label: 'Jørpeland – Strand rådhus', quayId: QUAY_JORPELAND, opposite: 'forsand' }
        };

        let selectedStop = 'forsand';
        let currentQuayId = STOP_CONFIG[selectedStop].quayId;
        let expandedList = false;

        function updateHeader() {
            const stopName = STOP_CONFIG[selectedStop].label;
            document.getElementById('headerTitle').textContent = `Buss fra ${stopName}`;
            document.querySelectorAll('.stop-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.stop === selectedStop);
            });
        }

        function isWeekend(date) {
            const day = date.getDay();
            return day === 0 || day === 6;
        }

        function formatTime(isoString) {
            const date = new Date(isoString);
            return date.toLocaleTimeString('no-NO', { hour: '2-digit', minute: '2-digit' });
        }

        function formatDate(date) {
            return new Intl.DateTimeFormat('no-NO', {
                weekday: 'long',
                day: 'numeric',
                month: 'short'
            }).format(date);
        }

        function getCountdown(isoString) {
            const now = new Date();
            const departureTime = new Date(isoString);
            const diffMs = departureTime - now;
            const diffMins = Math.floor(diffMs / 60000);

            if (diffMins < 0) return 'Kjørt';
            if (diffMins === 0) return 'Nå';
            if (diffMins === 1) return 'Om 1 minutt';
            if (diffMins < 60) return `Om ${diffMins} minutter`;

            const hours = Math.floor(diffMins / 60);
            const mins = diffMins % 60;
            return `Om ${hours}t ${mins}m`;
        }

        function describeRouteTarget() {
            const stop = STOP_CONFIG[selectedStop];
            const opposite = STOP_CONFIG[stop.opposite].label;
            return `Mot ${opposite}`;
        }

        function getLocalFallbackDeparture() {
            const now = new Date();
            const nextMonday = new Date(now);
            const day = now.getDay();
            const offset = day === 1 ? 7 : ((8 - day) % 7 || 7);
            nextMonday.setDate(now.getDate() + offset);

            const minutes = selectedStop === 'forsand' ? 24 : 49;
            const destination = selectedStop === 'forsand' ? 'Jørpeland' : 'Forsand skule';
            nextMonday.setHours(6, minutes, 0, 0);

            return {
                expectedDepartureTime: nextMonday.toISOString(),
                aimedDepartureTime: nextMonday.toISOString(),
                realtime: false,
                destinationDisplay: { frontText: destination },
                serviceJourney: { line: { publicCode: '120' } }
            };
        }

        function filterCalls(call) {
            const lineCode = ((call.serviceJourney && call.serviceJourney.line && call.serviceJourney.line.publicCode) || '').toUpperCase();
            const text = ((call.destinationDisplay && call.destinationDisplay.frontText) || '').toLowerCase();
            const isWantedLine = lineCode === '120' || lineCode === 'SK2901';

            if (!isWantedLine) {
                return false;
            }

            if (selectedStop === 'forsand') {
                return text.includes('jørpeland') || text.includes('forsand') || text.includes('berg') || text.includes('vgs') || text.includes('skule') || text.includes('strand');
            }

            return text.includes('forsand') || text.includes('jørpeland') || text.includes('berg') || text.includes('vgs') || text.includes('skule') || text.includes('strand');
        }

        function getNextDeparture(departures, offset = 1) {
            if (!Array.isArray(departures) || !departures.length) return null;

            const now = Date.now();
            const future = departures
                .filter(call => {
                    const departureTime = new Date(call.expectedDepartureTime || call.aimedDepartureTime);
                    return departureTime.getTime() >= now;
                })
                .sort((a, b) => {
                    const aTime = new Date(a.expectedDepartureTime || a.aimedDepartureTime).getTime();
                    const bTime = new Date(b.expectedDepartureTime || b.aimedDepartureTime).getTime();
                    return aTime - bTime;
                });

            if (!future.length) return null;
            const index = Math.max(0, Math.min(offset, future.length - 1));
            return future[index];
        }

        function getNextServiceFallback() {
            const now = new Date();
            const next = new Date(now);
            const day = next.getDay();
            const daysUntilMonday = day === 0 ? 1 : (8 - day) % 7;
            next.setDate(next.getDate() + (daysUntilMonday === 0 ? 7 : daysUntilMonday));
            next.setHours(6, 24, 0, 0);
            return next;
        }

        function setNextBusSummary(nextDeparture) {
            const nextBusTime = document.getElementById('nextBusTime');
            const nextBusMeta = document.getElementById('nextBusMeta');
            const serviceState = document.getElementById('serviceState');
            const headerStatus = document.getElementById('headerStatus');

            if (!nextDeparture) {
                const fallbackTime = getNextServiceFallback();
                nextBusTime.textContent = formatTime(fallbackTime.toISOString());
                nextBusMeta.textContent = `${formatDate(fallbackTime)} · ${describeRouteTarget()} · ${getCountdown(fallbackTime.toISOString())}`;
                serviceState.textContent = 'Helg';
                headerStatus.textContent = 'Helg';
                return;
            }

            const departureTime = new Date(nextDeparture.expectedDepartureTime || nextDeparture.aimedDepartureTime);
            const summary = `${formatDate(departureTime)} · ${describeRouteTarget()} · ${getCountdown(nextDeparture.expectedDepartureTime || nextDeparture.aimedDepartureTime)}`;

            nextBusTime.textContent = formatTime(nextDeparture.expectedDepartureTime || nextDeparture.aimedDepartureTime);
            nextBusMeta.textContent = summary;
            serviceState.textContent = isWeekend(departureTime) ? 'Helg' : 'Aktiv';
            headerStatus.textContent = isWeekend(departureTime) ? 'Helg' : 'Live';
        }

        async function fetchDeparturesForQuay(quayId) {
            try {
                const query = `
                    query {
                      quay(id: "${quayId}") {
                        name
                        estimatedCalls(numberOfDepartures: 80, timeRange: 604800) {
                          expectedDepartureTime
                          aimedDepartureTime
                          realtime
                          destinationDisplay {
                            frontText
                          }
                          serviceJourney {
                            line {
                              publicCode
                            }
                            estimatedCalls {
                              quay {
                                name
                                id
                              }
                              expectedArrivalTime
                              aimedArrivalTime
                            }
                          }
                        }
                      }
                    }
                `;

                const response = await fetch(ENTUR_API, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'ET-Client-Name': 'forsand-buss-app'
                    },
                    body: JSON.stringify({ query })
                });

                if (!response.ok) {
                    throw new Error(`Kunne ikke hente avganger (${response.status})`);
                }

                const data = await response.json();
                if (data.errors) {
                    throw new Error(data.errors[0].message || 'Ukjent feil fra Entur');
                }

                return data.data;
            } catch (error) {
                console.error(error);
                throw error;
            }
        }

        async function fetchDepartures() {
            return fetchDeparturesForQuay(currentQuayId);
        }

        function getArrivalInfo(estimatedCalls) {
            if (!estimatedCalls || !estimatedCalls.length) return null;

            const nextStop = STOP_CONFIG[selectedStop].opposite;
            const targetName = STOP_CONFIG[nextStop].label.toLowerCase();

            const match = estimatedCalls.find(call => {
                if (!call.quay) return false;
                const quayText = (call.quay.name || '').toLowerCase();
                return quayText.includes(targetName) || call.quay.id === STOP_CONFIG[nextStop].quayId;
            });

            if (!match) return null;
            return match.expectedArrivalTime || match.aimedArrivalTime;
        }

        function buildFallbackDepartures() {
            const now = new Date();
            const nextMonday = new Date(now);
            const day = now.getDay();
            const daysUntilMonday = day === 1 ? 7 : ((8 - day) % 7 || 7);
            nextMonday.setDate(now.getDate() + daysUntilMonday);

            const times = selectedStop === 'forsand'
                ? [6, 24, 8, 0, 9, 49, 11, 44, 15, 24]
                : [6, 49, 8, 30, 10, 45, 13, 15, 15, 50];

            const destination = selectedStop === 'forsand' ? 'Jørpeland' : 'Forsand skule';
            return times.reduce((list, value, index) => {
                if (index % 2 === 0) {
                    const hour = value;
                    const minute = times[index + 1];
                    const dt = new Date(nextMonday);
                    dt.setHours(hour, minute, 0, 0);
                    list.push({
                        expectedDepartureTime: dt.toISOString(),
                        aimedDepartureTime: dt.toISOString(),
                        realtime: false,
                        destinationDisplay: { frontText: destination },
                        serviceJourney: { line: { publicCode: '120' } }
                    });
                }
                return list;
            }, []);
        }

        function getRelevantDepartures(data) {
            if (!data || !data.quay || !data.quay.estimatedCalls || !data.quay.estimatedCalls.length) {
                return buildFallbackDepartures();
            }

            const departures = data.quay.estimatedCalls
                .filter(call => {
                    const depTime = new Date(call.expectedDepartureTime || call.aimedDepartureTime);
                    return depTime.getTime() >= Date.now();
                })
                .filter(filterCalls)
                .sort((a, b) => {
                    const aTime = new Date(a.expectedDepartureTime || a.aimedDepartureTime).getTime();
                    const bTime = new Date(b.expectedDepartureTime || b.aimedDepartureTime).getTime();
                    return aTime - bTime;
                });

            return departures.length ? departures : buildFallbackDepartures();
        }

        function renderList(data) {
            const statusPanel = document.getElementById('statusPanel');

            let departures = getRelevantDepartures(data);
            const nextDeparture = getNextDeparture(departures, 0);
            setNextBusSummary(nextDeparture);

            if (!departures.length || !data || !data.quay || !data.quay.estimatedCalls || !data.quay.estimatedCalls.length) {
                const targetStop = STOP_CONFIG[selectedStop].label;
                statusPanel.innerHTML = `<div class="empty-state">Ingen lokale avganger funnet fra ${targetStop}. Neste lokal buss går mandag.</div>`;
                return;
            }

            const defaultVisibleCount = 2;
            const visibleDepartures = expandedList ? departures : departures.slice(1, 1 + defaultVisibleCount);
            const cards = visibleDepartures.map(call => {
                const time = formatTime(call.expectedDepartureTime || call.aimedDepartureTime);
                const line = call.serviceJourney && call.serviceJourney.line ? call.serviceJourney.line.publicCode : '?';
                const destination = (call.destinationDisplay && call.destinationDisplay.frontText) || 'Ukjent';
                const arrival = getArrivalInfo(call.serviceJourney.estimatedCalls);
                const arrivalLabel = arrival ? `Ankommer ${formatTime(arrival)}` : 'Vis mer';
                const timeClass = call.realtime ? 'realtime' : (call.expectedDepartureTime !== call.aimedDepartureTime ? 'delayed' : '');

                return `
                    <div class="departure-card">
                        <div class="line-badge">${line}</div>
                        <div class="departure-main">
                            <p class="route-name">${destination}</p>
                            <div class="route-stop">${data.quay.name}</div>
                        </div>
                        <div class="time-side">
                            <div class="departure-time ${timeClass}">${time}</div>
                            <div class="time-sub">${arrivalLabel}</div>
                            <div class="time-sub">${getCountdown(call.expectedDepartureTime || call.aimedDepartureTime)}</div>
                        </div>
                    </div>
                `;
            }).join('');

            let buttonMarkup = '';
            if (departures.length > defaultVisibleCount) {
                buttonMarkup = `<button class="show-more" type="button">${expandedList ? 'Vis færre' : 'Vis flere ruter'}</button>`;
            }

            statusPanel.innerHTML = `<div class="departures">${cards}${buttonMarkup}</div>`;

            const button = statusPanel.querySelector('.show-more');
            if (button) {
                button.addEventListener('click', () => {
                    expandedList = !expandedList;
                    updateDepartures();
                });
            }
        }

        function showError(message) {
            document.getElementById('statusPanel').innerHTML = `<div class="error">Feil: ${message}</div>`;
        }

        async function updateDepartures() {
            try {
                const data = await fetchDepartures();
                renderList(data);
                document.getElementById('lastUpdated').textContent = `Sist oppdatert: ${new Date().toLocaleTimeString('no-NO')}`;
            } catch (error) {
                console.error(error);
                showError(error.message || 'Kunne ikke hente sanntidsdata');
            }
        }

        function setStop(stopKey) {
            selectedStop = stopKey;
            currentQuayId = STOP_CONFIG[stopKey].quayId;
            expandedList = false;
            updateHeader();
            updateDepartures();
        }

        document.querySelectorAll('.stop-btn').forEach(button => {
            button.addEventListener('click', () => setStop(button.dataset.stop));
        });

        updateHeader();
        updateDepartures();
        setInterval(updateDepartures, 60000);
    </script>
</body>
</html>
