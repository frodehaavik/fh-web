<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Bussavganger Forsand</title>
    <style>
        :root {
            --bg: #ebf1ee;
            --paper: rgba(255, 255, 255, 0.9);
            --panel: #ffffff;
            --ink: #163a38;
            --muted: #5f7c78;
            --line: #dfeae6;
            --brand: #0e6763;
            --brand-2: #255f60;
            --brand-soft: #dcf0ed;
            --gold: #d8a74b;
            --success: #2a9d76;
            --danger: #c85d5a;
            --shadow: 0 18px 38px rgba(18, 52, 53, 0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            background: radial-gradient(circle at top left, rgba(255,255,255,0.9), transparent 28%),
                        linear-gradient(160deg, #edf4f0 0%, #e8efe9 50%, #f4efe1 100%);
            min-height: 100vh;
            color: var(--ink);
            padding: 18px 12px 32px;
        }

        .container {
            max-width: 880px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.36);
            border: 1px solid rgba(28, 78, 75, 0.12);
            border-radius: 22px;
            box-shadow: var(--shadow);
            overflow: hidden;
            backdrop-filter: blur(8px);
        }

        header {
            background: linear-gradient(135deg, var(--brand) 0%, var(--brand-2) 38%, #517f75 100%);
            color: white;
            padding: 28px 28px 20px;
            position: relative;
            overflow: hidden;
        }

        header::after {
            content: "";
            position: absolute;
            right: -80px;
            bottom: -120px;
            width: 250px;
            height: 250px;
            border-radius: 50%;
            background: rgba(255,255,255,0.08);
            box-shadow: 0 0 0 28px rgba(255,255,255,0.02), 0 0 0 58px rgba(255,255,255,0.02);
        }

        .header-inner {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: 16px;
        }

        .eyebrow {
            margin: 0 0 8px;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: rgba(235, 246, 242, 0.82);
        }

        h1 {
            font-size: clamp(1.8rem, 2vw + 1rem, 2.8rem);
            font-weight: 800;
            letter-spacing: -0.04em;
            line-height: 1.1;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: 999px;
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.18);
            color: #f4fbf9;
            font-size: 0.76rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .status-pill::before {
            content: "";
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #8fe1ae;
            box-shadow: 0 0 12px rgba(143, 225, 174, 0.8);
        }

        .hero-card {
            margin: -10px 22px 0;
            position: relative;
            z-index: 2;
            background: linear-gradient(180deg, rgba(255,255,255,0.95), rgba(244,249,247,0.95));
            border: 1px solid rgba(14, 103, 99, 0.1);
            border-radius: 18px;
            box-shadow: 0 10px 24px rgba(16, 74, 73, 0.12);
            padding: 18px 20px;
        }

        .meta-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: center;
            margin-bottom: 12px;
        }

        .meta-label {
            font-size: 0.7rem;
            font-weight: 800;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .meta-badge {
            display: inline-flex;
            align-items: center;
            border-radius: 999px;
            background: var(--brand-soft);
            color: var(--brand);
            padding: 6px 10px;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .next-bus {
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .next-bus strong {
            display: block;
            font-size: clamp(2rem, 2vw + 0.9rem, 3.2rem);
            line-height: 1;
            font-weight: 800;
            letter-spacing: -0.04em;
            color: var(--ink);
        }

        .next-bus small {
            display: block;
            color: var(--muted);
            font-size: 0.9rem;
            line-height: 1.5;
            font-weight: 600;
            text-align: right;
        }

        .control-panel {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 18px 22px 0;
            flex-wrap: wrap;
        }

        .direction-toggle {
            display: inline-flex;
            background: rgba(14, 103, 99, 0.08);
            border: 1px solid rgba(14, 103, 99, 0.12);
            border-radius: 12px;
            padding: 5px;
            gap: 6px;
        }

        .direction-btn {
            border: none;
            background: transparent;
            color: var(--muted);
            font: inherit;
            font-size: 0.92rem;
            font-weight: 700;
            border-radius: 9px;
            padding: 10px 16px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .direction-btn.active {
            background: linear-gradient(135deg, #0f6d68, #1a8a7a);
            color: white;
            box-shadow: 0 8px 18px rgba(15, 109, 104, 0.2);
        }

        .last-updated {
            margin-left: auto;
            color: var(--muted);
            font-size: 0.76rem;
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        .loading,
        .error,
        .no-departures {
            padding: 34px 22px 42px;
            text-align: center;
            color: var(--muted);
            font-size: 1rem;
            font-weight: 600;
        }

        .error {
            color: var(--danger);
            background: rgba(200, 93, 90, 0.05);
        }

        .departures {
            padding: 16px 18px 20px;
        }

        .departure {
            display: grid;
            grid-template-columns: auto minmax(0, 1fr) auto;
            gap: 14px;
            align-items: center;
            background: rgba(255,255,255,0.72);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 16px 14px;
            margin-top: 10px;
            box-shadow: 0 6px 14px rgba(17, 38, 36, 0.04);
        }

        .line-number {
            background: linear-gradient(135deg, var(--brand) 0%, var(--brand-2) 100%);
            color: white;
            min-width: 56px;
            text-align: center;
            padding: 11px 12px;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: 800;
            line-height: 1;
            box-shadow: 0 8px 20px rgba(15, 109, 104, 0.18);
        }

        .destination {
            min-width: 0;
        }

        .destination-name {
            font-size: 1.02rem;
            font-weight: 700;
            color: var(--ink);
            line-height: 1.35;
        }

        .quay {
            margin-top: 4px;
            font-size: 0.78rem;
            color: var(--muted);
            font-weight: 600;
        }

        .time-info {
            text-align: right;
            white-space: nowrap;
        }

        .departure-time {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--ink);
            line-height: 1.2;
        }

        .arrival-time {
            font-size: 0.72rem;
            color: var(--muted);
            margin-top: 3px;
            font-weight: 700;
        }

        .countdown {
            margin-top: 4px;
            font-size: 0.76rem;
            color: var(--muted);
            font-weight: 700;
        }

        .realtime {
            color: var(--success);
        }

        .delayed {
            color: var(--danger);
        }

        @media (max-width: 620px) {
            body {
                padding: 10px 8px 24px;
            }

            header {
                padding: 18px 18px 16px;
            }

            .header-inner {
                align-items: flex-start;
                flex-direction: column;
            }

            .status-pill {
                margin-top: 6px;
            }

            .hero-card {
                margin: -2px 14px 0;
                padding: 14px 16px;
            }

            .meta-row {
                align-items: flex-start;
                flex-direction: column;
            }

            .next-bus {
                align-items: flex-start;
                flex-direction: column;
            }

            .next-bus small {
                text-align: left;
            }

            .control-panel {
                padding: 16px 14px 0;
            }

            .direction-toggle {
                width: 100%;
            }

            .direction-btn {
                flex: 1;
                padding: 10px 12px;
            }

            .last-updated {
                width: 100%;
                text-align: right;
                margin-left: 0;
            }

            .departures {
                padding: 12px 12px 18px;
            }

            .departure {
                grid-template-columns: auto 1fr;
                align-items: start;
                gap: 10px 12px;
            }

            .time-info {
                grid-column: 2;
                text-align: left;
                justify-self: start;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-inner">
                <div>
                    <p class="eyebrow">Rutenett · Forsand</p>
                    <h1 id="headerTitle">Bussavganger Forsand</h1>
                </div>
                <span class="status-pill" id="headerStatus">Live</span>
            </div>
        </header>

        <div class="hero-card" aria-live="polite">
            <div class="meta-row">
                <span class="meta-label">Neste buss</span>
                <span class="meta-badge" id="serviceState">Sjekker</span>
            </div>
            <div class="next-bus">
                <div>
                    <strong id="nextBusTime">--:--</strong>
                </div>
                <small id="nextBusMeta">Laster data...</small>
            </div>
        </div>

        <div class="control-panel">
            <div class="direction-toggle" aria-label="Velg retning">
                <button class="direction-btn active" id="btnFra" type="button">Fra Forsand</button>
                <button class="direction-btn" id="btnTil" type="button">Til Forsand</button>
            </div>
            <div class="last-updated">Laster data...</div>
        </div>

        <div id="content" class="loading">Henter sanntidsdata...</div>
    </div>

    <script>
        const QUAY_JORPELAND = 'NSR:Quay:45500';
        const QUAY_FORSAND = 'NSR:Quay:48722';
        const ENTUR_API = 'https://api.entur.io/journey-planner/v3/graphql';

        let currentDirection = 'fra';
        let currentQuayId = QUAY_FORSAND;

        function isWeekend(date) {
            const day = date.getDay();
            return day === 0 || day === 6;
        }

        function formatTime(isoString) {
            const date = new Date(isoString);
            return date.toLocaleTimeString('no-NO', { hour: '2-digit', minute: '2-digit' });
        }

        function formatDate(date) {
            return new Intl.DateTimeFormat('no-NO', {
                weekday: 'long',
                day: 'numeric',
                month: 'short'
            }).format(date);
        }

        function getCountdown(isoString) {
            const now = new Date();
            const departureTime = new Date(isoString);
            const diffMs = departureTime - now;
            const diffMins = Math.floor(diffMs / 60000);

            if (diffMins < 0) return 'Kjørt';
            if (diffMins === 0) return 'Nå';
            if (diffMins === 1) return 'Om 1 minutt';
            if (diffMins < 60) return `Om ${diffMins} minutter`;

            const hours = Math.floor(diffMins / 60);
            const mins = diffMins % 60;
            return `Om ${hours}t ${mins}m`;
        }

        function getDirectionMatch(call, direction) {
            const destinationText = ((call.destinationDisplay && call.destinationDisplay.frontText) || '').toLowerCase();

            if (direction === 'fra') {
                return destinationText.includes('jørpeland') || destinationText.includes('forsand');
            }

            return !destinationText.includes('jørpeland') && !destinationText.includes('forsand');
        }

        function getNextDeparture(departures) {
            if (!Array.isArray(departures) || !departures.length) return null;

            const now = Date.now();
            const futureDepartures = departures.filter(call => {
                const departureTime = new Date(call.expectedDepartureTime || call.aimedDepartureTime);
                return departureTime.getTime() >= now;
            });

            if (!futureDepartures.length) return null;

            return futureDepartures.reduce((earliest, current) => {
                const earliestTime = new Date(earliest.expectedDepartureTime || earliest.aimedDepartureTime).getTime();
                const currentTime = new Date(current.expectedDepartureTime || current.aimedDepartureTime).getTime();
                return currentTime < earliestTime ? current : earliest;
            });
        }

        function setNextBusSummary(nextDeparture) {
            const nextBusTime = document.getElementById('nextBusTime');
            const nextBusMeta = document.getElementById('nextBusMeta');
            const serviceState = document.getElementById('serviceState');
            const headerStatus = document.getElementById('headerStatus');

            if (!nextDeparture) {
                nextBusTime.textContent = 'Ingen buss';
                nextBusMeta.textContent = 'Ingen avganger er registrert for de nærmeste dagene';
                serviceState.textContent = 'Ingen rute';
                headerStatus.textContent = 'Stengt';
                return;
            }

            const departureTime = new Date(nextDeparture.expectedDepartureTime || nextDeparture.aimedDepartureTime);
            const directionText = currentDirection === 'fra' ? 'Mot Jørpeland' : 'Mot Forsand';
            const summaryText = `${formatDate(departureTime)} · ${directionText} · ${getCountdown(nextDeparture.expectedDepartureTime || nextDeparture.aimedDepartureTime)}`;

            nextBusTime.textContent = formatTime(nextDeparture.expectedDepartureTime || nextDeparture.aimedDepartureTime);
            nextBusMeta.textContent = summaryText;
            serviceState.textContent = isWeekend(departureTime) ? 'Helg' : 'Aktiv';
            headerStatus.textContent = isWeekend(departureTime) ? 'Helg' : 'Live';
        }

        async function fetchDepartures() {
            const query = `
            {
              quay(id: "${currentQuayId}") {
                name
                estimatedCalls(numberOfDepartures: 80, timeRange: 604800) {
                  expectedDepartureTime
                  aimedDepartureTime
                  realtime
                  destinationDisplay {
                    frontText
                  }
                  serviceJourney {
                    id
                    line {
                      publicCode
                      transportMode
                    }
                    estimatedCalls {
                      quay {
                        name
                        id
                      }
                      aimedDepartureTime
                      expectedDepartureTime
                      aimedArrivalTime
                      expectedArrivalTime
                    }
                  }
                }
              }
            }`;

            try {
                const response = await fetch(ENTUR_API, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'ET-Client-Name': 'fhaavik-forsand-buss'
                    },
                    body: JSON.stringify({ query })
                });

                if (!response.ok) {
                    throw new Error(`HTTP-feil: ${response.status}`);
                }

                const data = await response.json();

                if (data.errors) {
                    throw new Error(data.errors[0].message);
                }

                return data.data;
            } catch (error) {
                console.error('Feil ved henting av data:', error);
                throw error;
            }
        }

        function getArrivalTimes(estimatedCalls) {
            if (!estimatedCalls || estimatedCalls.length === 0) return {};

            const arrivals = {};
            const startIndex = estimatedCalls.findIndex(call =>
                call.quay && (call.quay.id === currentQuayId)
            );

            if (startIndex === -1) return arrivals;

            for (let i = startIndex + 1; i < estimatedCalls.length; i++) {
                const call = estimatedCalls[i];
                if (!call.quay || !call.quay.name) continue;

                const name = call.quay.name.toLowerCase();
                const time = call.expectedArrivalTime || call.aimedArrivalTime;

                if (!arrivals.jorpeland && (name.includes('jørpeland') || call.quay.id === QUAY_JORPELAND)) {
                    arrivals.jorpeland = time;
                }

                if (!arrivals.forsand && (name.includes('forsand') || call.quay.id === QUAY_FORSAND)) {
                    arrivals.forsand = time;
                }
            }

            return arrivals;
        }

        function renderDepartures(data) {
            const content = document.getElementById('content');
            const lastUpdated = document.querySelector('.last-updated');

            if (!data.quay || !data.quay.estimatedCalls || data.quay.estimatedCalls.length === 0) {
                content.innerHTML = '<div class="no-departures">Ingen avganger funnet for de nærmeste dagene.</div>';
                setNextBusSummary(null);
                return;
            }

            let departures = data.quay.estimatedCalls.filter(call => {
                const depTime = new Date(call.expectedDepartureTime || call.aimedDepartureTime);
                return depTime.getTime() >= Date.now();
            });

            departures = departures.filter(call => getDirectionMatch(call, currentDirection));

            const nextDeparture = getNextDeparture(departures);
            setNextBusSummary(nextDeparture);

            if (!departures.length) {
                content.innerHTML = '<div class="no-departures">Det går ingen busser i denne retningen de nærmeste dagene.</div>';
                return;
            }

            let html = '<div class="departures">';

            departures.slice(0, 12).forEach(call => {
                const isDelayed = call.expectedDepartureTime !== call.aimedDepartureTime;
                const timeClass = call.realtime ? 'realtime' : (isDelayed ? 'delayed' : '');
                const lineNumber = call.serviceJourney.line.publicCode;
                const destination = call.destinationDisplay.frontText;
                const departureTime = formatTime(call.expectedDepartureTime || call.aimedDepartureTime);
                const countdown = getCountdown(call.expectedDepartureTime || call.aimedDepartureTime);

                const arrivals = getArrivalTimes(call.serviceJourney.estimatedCalls);
                let arrivalTimeHtml = '';

                if (currentDirection === 'fra') {
                    if (arrivals.jorpeland) {
                        arrivalTimeHtml = `<div class="arrival-time">Ankommer ${formatTime(arrivals.jorpeland)}</div>`;
                    }
                } else if (arrivals.forsand) {
                    arrivalTimeHtml = `<div class="arrival-time">Ankommer ${formatTime(arrivals.forsand)}</div>`;
                }

                html += `
                    <div class="departure">
                        <div class="line-number">${lineNumber}</div>
                        <div class="destination">
                            <div class="destination-name">${destination}</div>
                            <div class="quay">${data.quay.name}</div>
                        </div>
                        <div class="time-info">
                            <div class="departure-time ${timeClass}">${departureTime}</div>
                            ${arrivalTimeHtml}
                            <div class="countdown">${countdown}</div>
                        </div>
                    </div>
                `;
            });

            html += '</div>';
            content.innerHTML = html;

            lastUpdated.textContent = `Sist oppdatert: ${new Date().toLocaleTimeString('no-NO')}`;
        }

        function showError(message) {
            const content = document.getElementById('content');
            content.innerHTML = `<div class="error">⚠️ Feil: ${message}</div>`;
        }

        async function updateDepartures() {
            try {
                const data = await fetchDepartures();
                renderDepartures(data);
            } catch (error) {
                showError(error.message || 'Kunne ikke hente avganger');
            }
        }

        function setDirection(direction) {
            currentDirection = direction;
            document.getElementById('btnFra').classList.toggle('active', direction === 'fra');
            document.getElementById('btnTil').classList.toggle('active', direction === 'til');

            currentQuayId = direction === 'fra' ? QUAY_FORSAND : QUAY_JORPELAND;
            updateDepartures();
        }

        updateDepartures();
        setInterval(updateDepartures, 60000);

        document.getElementById('btnFra').addEventListener('click', () => setDirection('fra'));
        document.getElementById('btnTil').addEventListener('click', () => setDirection('til'));
    </script>
</body>
</html>
