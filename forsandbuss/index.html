<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Forsand Buss</title>
    <style>
        :root {
            --bg: #edf3f0;
            --paper: rgba(255,255,255,0.82);
            --panel: #ffffff;
            --ink: #1a2a2a;
            --muted: #5a6f6d;
            --line: #dfe9e5;
            --brand: #0d6763;
            --brand-2: #1b7d78;
            --brand-soft: #ddf1ee;
            --accent: #f1b75d;
            --success: #2b9a74;
            --danger: #d15754;
            --shadow: 0 18px 42px rgba(12, 46, 47, 0.14);
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            min-height: 100%;
            font-family: "Segoe UI", Inter, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            background: radial-gradient(circle at top left, rgba(255,255,255,0.8), transparent 26%), linear-gradient(155deg, #edf3f0 0%, #e8f0ee 43%, #f4efe3 100%);
            color: var(--ink);
        }

        body {
            padding: 20px 12px 32px;
        }

        .app-shell {
            max-width: 980px;
            margin: 0 auto;
            background: rgba(255,255,255,0.38);
            border: 1px solid rgba(24, 77, 75, 0.12);
            border-radius: 24px;
            box-shadow: var(--shadow);
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .topbar {
            background: linear-gradient(135deg, var(--brand) 0%, var(--brand-2) 40%, #5a7a74 100%);
            color: white;
            padding: 26px 26px 18px;
            position: relative;
            overflow: hidden;
        }

        .topbar::after {
            content: "";
            position: absolute;
            right: -80px;
            bottom: -100px;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            background: rgba(255,255,255,0.08);
            box-shadow: 0 0 0 30px rgba(255,255,255,0.02), 0 0 0 60px rgba(255,255,255,0.02);
        }

        .topbar-inner {
            position: relative;
            z-index: 1;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 14px;
        }

        .eyebrow {
            margin: 0 0 10px;
            font-size: 0.72rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            font-weight: 800;
            color: rgba(234, 247, 244, 0.82);
        }

        h1 {
            margin: 0;
            font-size: clamp(2rem, 2vw + 1.1rem, 3rem);
            line-height: 1.08;
            letter-spacing: -0.05em;
        }

        .live-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 999px;
            padding: 8px 14px;
            font-size: 0.72rem;
            font-weight: 800;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .live-pill::before {
            content: "";
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #8fe2af;
            box-shadow: 0 0 12px rgba(143, 226, 175, 0.9);
        }

        .hero {
            margin: -10px 22px 0;
            padding: 18px 20px 12px;
            background: linear-gradient(180deg, rgba(255,255,255,0.96), rgba(245,250,248,0.96));
            border: 1px solid rgba(11, 92, 88, 0.12);
            border-radius: 18px;
            position: relative;
            z-index: 2;
            box-shadow: 0 10px 24px rgba(6, 52, 49, 0.1);
        }

        .hero-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 12px;
        }

        .label {
            font-size: 0.7rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--muted);
            font-weight: 800;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 6px 10px;
            border-radius: 999px;
            background: var(--brand-soft);
            color: var(--brand);
            font-size: 0.72rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .next-row {
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .next-time {
            font-size: clamp(2.2rem, 2vw + 1rem, 3.2rem);
            line-height: 1;
            font-weight: 900;
            letter-spacing: -0.06em;
            margin: 0;
        }

        .next-meta {
            margin: 0;
            color: var(--muted);
            font-size: 0.9rem;
            line-height: 1.5;
            text-align: right;
            font-weight: 600;
        }

        .controls {
            padding: 16px 22px 0;
        }

        .stop-picker {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .stop-btn, .mode-btn {
            appearance: none;
            border: 1px solid rgba(13, 103, 99, 0.16);
            background: rgba(13, 103, 99, 0.04);
            color: var(--muted);
            border-radius: 12px;
            padding: 10px 14px;
            font: inherit;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.18s ease;
        }

        .stop-btn {
            flex: 1 1 130px;
            min-width: 0;
        }

        .stop-btn.active, .mode-btn.active {
            background: linear-gradient(135deg, var(--brand), var(--brand-2));
            border-color: transparent;
            color: white;
            box-shadow: 0 10px 18px rgba(13, 103, 99, 0.18);
        }

        .mode-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .mode-toggle {
            display: inline-flex;
            gap: 6px;
            background: rgba(13, 103, 99, 0.06);
            border: 1px solid rgba(13,103,99,0.12);
            border-radius: 12px;
            padding: 5px;
        }

        .mode-btn {
            padding: 10px 14px;
            border-radius: 9px;
            min-width: 120px;
        }

        .last-updated {
            color: var(--muted);
            font-size: 0.76rem;
            font-weight: 800;
            letter-spacing: 0.03em;
        }

        .status-panel {
            padding: 0 18px 18px;
        }

        .loading, .error, .empty-state {
            background: rgba(255,255,255,0.7);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 32px 18px;
            color: var(--muted);
            font-weight: 700;
            text-align: center;
            margin: 18px;
        }

        .error {
            color: var(--danger);
            border-color: rgba(209, 87, 84, 0.2);
            background: rgba(209, 87, 84, 0.04);
        }

        .route-details {
            margin: 0 18px 18px;
            border: 1px solid var(--line);
            border-radius: 16px;
            background: rgba(255,255,255,0.72);
            overflow: hidden;
        }

        .route-details summary {
            list-style: none;
            cursor: pointer;
            padding: 14px 16px;
            font-size: 0.77rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--brand);
            font-weight: 800;
        }

        .route-details summary::-webkit-details-marker {
            display: none;
        }

        .route-details[open] summary {
            border-bottom: 1px solid var(--line);
            background: rgba(13,103,99,0.04);
        }

        .route-schedule {
            padding: 10px 14px 14px;
        }

        .schedule-grid {
            list-style: none;
            padding: 0;
            margin: 0;
            display: grid;
            gap: 8px;
        }

        .schedule-row {
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 10px;
            align-items: center;
            padding: 9px 10px;
            border-radius: 10px;
            border: 1px solid var(--line);
            background: rgba(255,255,255,0.8);
            color: var(--ink);
            font-size: 0.84rem;
        }

        .schedule-time {
            font-weight: 800;
            color: var(--brand);
            font-variant-numeric: tabular-nums;
        }

        .schedule-destination {
            font-weight: 700;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .schedule-status {
            color: var(--muted);
            font-size: 0.7rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .departures {
            padding: 0 18px 18px;
        }

        .departure-card {
            display: grid;
            grid-template-columns: auto minmax(0,1fr) auto;
            gap: 14px;
            align-items: center;
            background: rgba(255,255,255,0.76);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 14px 12px;
            margin-top: 10px;
            box-shadow: 0 6px 16px rgba(8, 48, 46, 0.05);
        }

        .line-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--brand), var(--brand-2));
            color: white;
            font-size: 1.2rem;
            font-weight: 900;
            line-height: 1;
            box-shadow: 0 10px 20px rgba(14, 103, 99, 0.18);
        }

        .departure-main {
            min-width: 0;
        }

        .route-name {
            margin: 0;
            font-size: 1.03rem;
            font-weight: 800;
            line-height: 1.35;
        }

        .route-stop {
            margin-top: 4px;
            color: var(--muted);
            font-size: 0.78rem;
            font-weight: 700;
        }

        .time-side {
            text-align: right;
            white-space: nowrap;
        }

        .departure-time {
            font-size: 1.3rem;
            font-weight: 900;
            letter-spacing: -0.04em;
            line-height: 1.1;
        }

        .time-sub {
            margin-top: 4px;
            font-size: 0.72rem;
            font-weight: 800;
            color: var(--muted);
        }

        .realtime { color: var(--success); }
        .delayed { color: var(--danger); }

        @media (max-width: 640px) {
            body { padding: 10px 8px 20px; }
            .topbar { padding: 18px 18px 14px; }
            .topbar-inner { align-items: flex-start; flex-direction: column; }
            .hero { margin: -2px 14px 0; padding: 14px 16px 10px; }
            .hero-top, .next-row, .mode-row { align-items: flex-start; flex-direction: column; }
            .next-meta { text-align: left; }
            .controls { padding: 14px 14px 0; }
            .stop-picker { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .stop-btn, .mode-btn { width: 100%; }
            .mode-toggle { width: 100%; }
            .last-updated { width: 100%; text-align: right; }
            .departure-card { grid-template-columns: auto 1fr; gap: 10px 12px; }
            .time-side { grid-column: 2; text-align: left; }
            .route-details, .departures, .status-panel { margin-left: 10px; margin-right: 10px; }
        }
    </style>
</head>
<body>
    <div class="app-shell">
        <header class="topbar">
            <div class="topbar-inner">
                <div>
                    <p class="eyebrow">Rutenett · Forsand</p>
                    <h1 id="headerTitle">Buss i Forsand</h1>
                </div>
                <span class="live-pill" id="headerStatus">Live</span>
            </div>
        </header>

        <section class="hero" aria-live="polite">
            <div class="hero-top">
                <span class="label">Neste buss</span>
                <span class="badge" id="serviceState">Sjekker</span>
            </div>
            <div class="next-row">
                <p class="next-time" id="nextBusTime">--:--</p>
                <p class="next-meta" id="nextBusMeta">Laster avganger...</p>
            </div>
        </section>

        <div class="controls">
            <div class="stop-picker" aria-label="Velg holdeplass">
                <button class="stop-btn active" type="button" data-stop="forsand">Forsand</button>
                <button class="stop-btn" type="button" data-stop="jorpeland">Jørpeland</button>
            </div>

            <div class="mode-row">
                <div class="mode-toggle" aria-label="Velg retning">
                    <button class="mode-btn active" type="button" data-mode="from">Fra holdeplass</button>
                    <button class="mode-btn" type="button" data-mode="to">Til holdeplass</button>
                </div>
                <div class="last-updated" id="lastUpdated">Laster data...</div>
            </div>
        </div>

        <div id="statusPanel" class="status-panel"></div>

        <details id="routeDetails" class="route-details">
            <summary>Vis hele ruten</summary>
            <div id="routeSchedule" class="route-schedule"></div>
        </details>
    </div>

    <script>
        const QUAY_FORSAND = 'NSR:Quay:48722';
        const QUAY_JORPELAND = 'NSR:Quay:45500';
        const ENTUR_API = 'https://api.entur.io/journey-planner/v3/graphql';

        const STOP_CONFIG = {
            forsand: { label: 'Forsand', quayId: QUAY_FORSAND, opposite: 'jorpeland' },
            jorpeland: { label: 'Jørpeland', quayId: QUAY_JORPELAND, opposite: 'forsand' }
        };

        let selectedStop = 'forsand';
        let selectedMode = 'from';
        let currentQuayId = STOP_CONFIG[selectedStop].quayId;

        function updateHeader() {
            const stopName = STOP_CONFIG[selectedStop].label;
            const title = selectedMode === 'from' ? `Buss fra ${stopName}` : `Buss til ${stopName}`;
            document.getElementById('headerTitle').textContent = title;
            document.querySelectorAll('.stop-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.stop === selectedStop);
            });
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.mode === selectedMode);
            });
        }

        function isWeekend(date) {
            const day = date.getDay();
            return day === 0 || day === 6;
        }

        function formatTime(isoString) {
            const date = new Date(isoString);
            return date.toLocaleTimeString('no-NO', { hour: '2-digit', minute: '2-digit' });
        }

        function formatDate(date) {
            return new Intl.DateTimeFormat('no-NO', {
                weekday: 'long',
                day: 'numeric',
                month: 'short'
            }).format(date);
        }

        function getCountdown(isoString) {
            const now = new Date();
            const departureTime = new Date(isoString);
            const diffMs = departureTime - now;
            const diffMins = Math.floor(diffMs / 60000);

            if (diffMins < 0) return 'Kjørt';
            if (diffMins === 0) return 'Nå';
            if (diffMins === 1) return 'Om 1 minutt';
            if (diffMins < 60) return `Om ${diffMins} minutter`;

            const hours = Math.floor(diffMins / 60);
            const mins = diffMins % 60;
            return `Om ${hours}t ${mins}m`;
        }

        function describeRouteTarget() {
            const stop = STOP_CONFIG[selectedStop];
            const opposite = STOP_CONFIG[stop.opposite].label;
            return selectedMode === 'from' ? `Mot ${opposite}` : `Fra ${opposite}`;
        }

        function getMatchText() {
            const stopName = STOP_CONFIG[selectedStop].label.toLowerCase();
            return selectedMode === 'from'
                ? (stopName === 'forsand' ? 'jørpeland' : 'forsand')
                : stopName;
        }

        function filterCalls(call) {
            const text = ((call.destinationDisplay && call.destinationDisplay.frontText) || '').toLowerCase();
            const target = getMatchText();
            if (selectedMode === 'from') {
                return text.includes(target) || text.includes('stavanger');
            }
            return text.includes(target);
        }

        function getNextDeparture(departures) {
            if (!Array.isArray(departures) || !departures.length) return null;

            const now = Date.now();
            const future = departures.filter(call => {
                const departureTime = new Date(call.expectedDepartureTime || call.aimedDepartureTime);
                return departureTime.getTime() >= now;
            });

            if (!future.length) return null;

            return future.reduce((earliest, current) => {
                const earliestTime = new Date(earliest.expectedDepartureTime || earliest.aimedDepartureTime).getTime();
                const currentTime = new Date(current.expectedDepartureTime || current.aimedDepartureTime).getTime();
                return currentTime < earliestTime ? current : earliest;
            });
        }

        function setNextBusSummary(nextDeparture) {
            const nextBusTime = document.getElementById('nextBusTime');
            const nextBusMeta = document.getElementById('nextBusMeta');
            const serviceState = document.getElementById('serviceState');
            const headerStatus = document.getElementById('headerStatus');

            if (!nextDeparture) {
                nextBusTime.textContent = 'Ingen buss';
                nextBusMeta.textContent = 'Ingen avganger funnet for valgt holdeplass og retning';
                serviceState.textContent = 'Ingen rute';
                headerStatus.textContent = 'Stengt';
                return;
            }

            const departureTime = new Date(nextDeparture.expectedDepartureTime || nextDeparture.aimedDepartureTime);
            const summary = `${formatDate(departureTime)} · ${describeRouteTarget()} · ${getCountdown(nextDeparture.expectedDepartureTime || nextDeparture.aimedDepartureTime)}`;

            nextBusTime.textContent = formatTime(nextDeparture.expectedDepartureTime || nextDeparture.aimedDepartureTime);
            nextBusMeta.textContent = summary;
            serviceState.textContent = isWeekend(departureTime) ? 'Helg' : 'Aktiv';
            headerStatus.textContent = isWeekend(departureTime) ? 'Helg' : 'Live';
        }

        async function fetchDepartures() {
            try {
                const query = `
                    query {
                      quay(id: "${currentQuayId}") {
                        name
                        estimatedCalls(numberOfDepartures: 80, timeRange: 604800) {
                          expectedDepartureTime
                          aimedDepartureTime
                          realtime
                          destinationDisplay {
                            frontText
                          }
                          serviceJourney {
                            line {
                              publicCode
                            }
                            estimatedCalls {
                              quay {
                                name
                                id
                              }
                              expectedArrivalTime
                              aimedArrivalTime
                            }
                          }
                        }
                      }
                    }
                `;

                const response = await fetch(ENTUR_API, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'ET-Client-Name': 'forsand-buss-app'
                    },
                    body: JSON.stringify({ query })
                });

                if (!response.ok) {
                    throw new Error(`Kunne ikke hente avganger (${response.status})`);
                }

                const data = await response.json();
                if (data.errors) {
                    throw new Error(data.errors[0].message || 'Ukjent feil fra Entur');
                }

                return data.data;
            } catch (error) {
                console.error(error);
                throw error;
            }
        }

        function getArrivalInfo(estimatedCalls) {
            if (!estimatedCalls || !estimatedCalls.length) return null;

            const targetStop = STOP_CONFIG[selectedStop].label.toLowerCase();
            const oppositeStop = STOP_CONFIG[STOP_CONFIG[selectedStop].opposite].label.toLowerCase();

            const match = estimatedCalls.find(call => {
                if (!call.quay) return false;
                const quayId = call.quay.id;
                const quayText = (call.quay.name || '').toLowerCase();

                if (selectedMode === 'from') {
                    return quayId === QUAY_JORPELAND || quayText.includes(oppositeStop);
                }

                return quayId === QUAY_FORSAND || quayText.includes(targetStop);
            });

            if (!match) return null;
            return match.expectedArrivalTime || match.aimedArrivalTime;
        }

        function renderSchedule(departures) {
            const scheduleRoot = document.getElementById('routeSchedule');
            if (!departures || !departures.length) {
                scheduleRoot.innerHTML = '<div class="empty-state">Ingen flere avganger registrert for valgt rute.</div>';
                return;
            }

            const rows = departures.slice(0, 12).map(call => {
                const time = formatTime(call.expectedDepartureTime || call.aimedDepartureTime);
                const destination = (call.destinationDisplay && call.destinationDisplay.frontText) || 'Ukjent destination';
                const status = call.realtime ? 'Sanntid' : 'Planlagt';
                return `
                    <li class="schedule-row">
                        <span class="schedule-time">${time}</span>
                        <span class="schedule-destination">${destination}</span>
                        <span class="schedule-status">${status}</span>
                    </li>
                `;
            }).join('');

            scheduleRoot.innerHTML = `<ul class="schedule-grid">${rows}</ul>`;
        }

        function renderList(data) {
            const statusPanel = document.getElementById('statusPanel');

            if (!data.quay || !data.quay.estimatedCalls || !data.quay.estimatedCalls.length) {
                statusPanel.innerHTML = '<div class="empty-state">Det går ingen busser i helgen. Neste buss går vanligvis mandag.</div>';
                setNextBusSummary(null);
                return;
            }

            let departures = data.quay.estimatedCalls
                .filter(call => {
                    const depTime = new Date(call.expectedDepartureTime || call.aimedDepartureTime);
                    return depTime.getTime() >= Date.now();
                })
                .filter(filterCalls);

            const nextDeparture = getNextDeparture(departures);
            setNextBusSummary(nextDeparture);

            if (!departures.length) {
                const targetStop = STOP_CONFIG[selectedStop].label;
                const message = selectedMode === 'from'
                    ? `Det går ingen busser fra ${targetStop} i denne retningen akkurat nå.`
                    : `Det går ingen busser til ${targetStop} i denne retningen akkurat nå.`;
                statusPanel.innerHTML = `<div class="empty-state">${message}</div>`;
                return;
            }

            const cards = departures.slice(0, 10).map(call => {
                const time = formatTime(call.expectedDepartureTime || call.aimedDepartureTime);
                const line = call.serviceJourney && call.serviceJourney.line ? call.serviceJourney.line.publicCode : '?';
                const destination = (call.destinationDisplay && call.destinationDisplay.frontText) || 'Ukjent';
                const arrival = getArrivalInfo(call.serviceJourney.estimatedCalls);
                const arrivalLabel = arrival ? `Ankommer ${formatTime(arrival)}` : 'Vis mer';
                const timeClass = call.realtime ? 'realtime' : (call.expectedDepartureTime !== call.aimedDepartureTime ? 'delayed' : '');

                return `
                    <div class="departure-card">
                        <div class="line-badge">${line}</div>
                        <div class="departure-main">
                            <p class="route-name">${destination}</p>
                            <div class="route-stop">${data.quay.name}</div>
                        </div>
                        <div class="time-side">
                            <div class="departure-time ${timeClass}">${time}</div>
                            <div class="time-sub">${arrivalLabel}</div>
                            <div class="time-sub">${getCountdown(call.expectedDepartureTime || call.aimedDepartureTime)}</div>
                        </div>
                    </div>
                `;
            }).join('');

            statusPanel.innerHTML = `<div class="departures">${cards}</div>`;
            renderSchedule(departures);
        }

        function showError(message) {
            document.getElementById('statusPanel').innerHTML = `<div class="error">Feil: ${message}</div>`;
        }

        async function updateDepartures() {
            try {
                const data = await fetchDepartures();
                renderList(data);
                document.getElementById('lastUpdated').textContent = `Sist oppdatert: ${new Date().toLocaleTimeString('no-NO')}`;
            } catch (error) {
                console.error(error);
                showError(error.message || 'Kunne ikke hente sanntidsdata');
            }
        }

        function setStop(stopKey) {
            selectedStop = stopKey;
            currentQuayId = STOP_CONFIG[stopKey].quayId;
            updateHeader();
            updateDepartures();
        }

        function setMode(mode) {
            selectedMode = mode;
            currentQuayId = selectedMode === 'from'
                ? STOP_CONFIG[selectedStop].quayId
                : STOP_CONFIG[STOP_CONFIG[selectedStop].opposite].quayId;
            updateHeader();
            updateDepartures();
        }

        document.querySelectorAll('.stop-btn').forEach(button => {
            button.addEventListener('click', () => setStop(button.dataset.stop));
        });

        document.querySelectorAll('.mode-btn').forEach(button => {
            button.addEventListener('click', () => setMode(button.dataset.mode));
        });

        updateHeader();
        updateDepartures();
        setInterval(updateDepartures, 60000);
    </script>
</body>
</html>
